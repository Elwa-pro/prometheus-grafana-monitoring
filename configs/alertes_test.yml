rule_files:
  - alertes.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="node", instance="srv-web01"}'
        values: '1 1 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: HoteInjoignable
        exp_alerts:
          - exp_labels: {severity: critical, job: node, instance: srv-web01}
            exp_annotations: {summary: "srv-web01 injoignable"}
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox_http", instance="http://192.168.255.11"}'
        values: '1 1 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: SiteInaccessible
        exp_alerts:
          - exp_labels: {severity: critical, job: blackbox_http, instance: "http://192.168.255.11"}
            exp_annotations: {summary: "Site http://192.168.255.11 inaccessible"}
  - interval: 1m
    input_series:
      - series: 'probe_duration_seconds{job="blackbox_http", instance="http://192.168.255.11"}'
        values: '0.8+0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: SiteLent
        exp_alerts: []
      - eval_time: 8m
        alertname: SiteLent
        exp_alerts:
          - exp_labels: {severity: warning, job: blackbox_http, instance: "http://192.168.255.11"}
            exp_annotations: {summary: "Site http://192.168.255.11 lent (> 500 ms)"}
